<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Degradado slime: cian → azul -->
    <linearGradient id="slime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF0FF"/>
      <stop offset="0.45" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#1A8CFF"/>
    </linearGradient>
    <!-- Borde con toque de magia púrpura -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <!-- Brillo suave -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo abisal redondeado -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="#080E1E" stroke="url(#edge)" stroke-width="2"/>

  <!-- Pieza: rey -->
  <g fill="url(#slime)" filter="url(#glow)">
    <!-- Cruz -->
    <rect x="29" y="7" width="6" height="16" rx="2"/>
    <rect x="24" y="12" width="16" height="6" rx="2"/>
    <!-- Cabeza / cúpula -->
    <path d="M20 37c0-8 5.5-13 12-13s12 5 12 13z"/>
    <!-- Collar -->
    <rect x="17" y="37" width="30" height="5" rx="2.5"/>
    <!-- Cuerpo -->
    <path d="M22 42h20l3.5 8h-27z"/>
    <!-- Base -->
    <rect x="13" y="50" width="38" height="7" rx="3.5"/>
  </g>

  <!-- Destello -->
  <path d="M26 31c1-3 3-5 6-5" fill="none" stroke="#E0E7FF" stroke-width="2" stroke-linecap="round" opacity=".7"/>
</svg>
